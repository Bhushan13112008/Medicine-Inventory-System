<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Medicine Inventory System</title>
  <link rel="stylesheet" href="login_styles.css">
</head>
<body class="auth-body">
  <div class="auth-card">
    <h2>Create Account</h2>
    <p class="subtitle">to continue to Medicine Inventory</p>

    <form id="signup-form">
      <div class="input-group">
        <input type="text" id="name" required placeholder=" ">
        <label for="name">Full Name</label>
      </div>

      <div class="input-group">
        <input type="email" id="email" required placeholder=" ">
        <label for="email">Email</label>
      </div>

      <div class="input-group">
        <input type="password" id="password" required placeholder=" ">
        <label for="password">Password</label>
      </div>

      <p id="error-message" class="error-text hidden"></p>
      <p id="success-message" class="success-text hidden"></p>

      <div class="auth-actions">
        <a href="login.html" class="link-btn">Sign in instead</a>
        <button type="submit" class="btn primary">Register</button>
      </div>
    </form>
  </div>

  <script src="signup.js"></script>
</body>
</html>
