<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login - Medicine Inventory System</title>
    <link rel="stylesheet" href="login_styles.css">
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Sign in</h2>
            <p>to continue to Medicine Inventory</p>
        </div>
        <form id="login-form">
            <div class="input-group">
                <input type="email" id="email" required placeholder=" " autocomplete="off">
                <label for="email">Email</label>
            </div>
            <div class="input-group">
                <input type="password" id="password" required placeholder=" " autocomplete="off">
                <label for="password">Password</label>
            </div>
            <div class="forgot-password">
                <a href="forgot-password.html" class="text-link">Forgot password?</a>
            </div>
            <p id="error-message" class="error-text hidden"></p>
            <div class="auth-actions">
                <a href="signup.html" class="text-button">Create new account</a>
                <button type="submit" class="btn primary">Sign In</button>
            </div>
        </form>
    </div>
    <script src="login.js"></script>
</body>
</html>
