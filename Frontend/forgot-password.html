<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Recovery - Medicine Inventory</title>
  <link rel="stylesheet" href="login_styles.css">
</head>
<body class="login-body">

  <div class="login-card" style="max-width: 420px; margin: 60px auto; padding: 30px; background-color: #1a1a1a; border-radius: 12px; color: #fff;">
    <h2>Account Recovery</h2>
    <p style="color: #a1a1aa; font-size: 0.9rem; margin-bottom: 20px;">Enter your email to request an OTP, then reset your password below.</p>

    <form id="forgot-password-form" style="display: flex; flex-direction: column; gap: 14px;">
      <!-- Email Input -->
      <div class="form-group" style="display: flex; flex-direction: column; gap: 6px;">
        <label for="email" style="font-size: 0.85rem; color: #a1a1aa;">Email</label>
        <input type="email" id="email" placeholder="Enter your registered email" required style="padding: 10px; background-color: #27272a; border: 1px solid #3f3f46; border-radius: 6px; color: #fff;" />
      </div>

      <!-- Send OTP Button -->
      <button type="button" id="send-otp-btn" style="padding: 10px; background-color: #3f3f46; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">
        Send OTP
      </button>

      <!-- OTP Input -->
      <div class="form-group" style="display: flex; flex-direction: column; gap: 6px; margin-top: 6px;">
        <label for="otp" style="font-size: 0.85rem; color: #a1a1aa;">OTP</label>
        <input type="text" id="otp" placeholder="Enter 6-digit OTP" required style="padding: 10px; background-color: #27272a; border: 1px solid #3f3f46; border-radius: 6px; color: #fff;" />
      </div>

      <!-- New Password Input -->
      <div class="form-group" style="display: flex; flex-direction: column; gap: 6px;">
        <label for="new-password" style="font-size: 0.85rem; color: #a1a1aa;">New Password</label>
        <input type="password" id="new-password" placeholder="Enter new password" required style="padding: 10px; background-color: #27272a; border: 1px solid #3f3f46; border-radius: 6px; color: #fff;" />
      </div>

      <!-- Status / Error Message Container -->
      <div id="message" style="font-size: 0.85rem; margin-top: 4px;"></div>

      <!-- Actions -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
        <a href="login.html" style="color: #60a5fa; text-decoration: none; font-size: 0.9rem;">Back to sign in</a>
        <button type="submit" id="submit-btn" style="padding: 10px 20px; background-color: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">
          Submit
        </button>
      </div>
    </form>
  </div>

  <script src="forgot_password.js"></script>
</body>
</html>
